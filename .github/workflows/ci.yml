name: Nova CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: nova-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nova
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: nova-ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      NOVA_CHANNEL_PREFIX: nova-ci-asgi
      NOVA_PRESENCE_PREFIX: nova-ci-presence

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check

      - name: Validate Google Play release script
        run: python -m py_compile ../scripts/publish_google_play.py

      - name: Run backend tests
        run: python manage.py test

  android:
    name: Android build
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew

      - name: Check Messages architecture
        run: python3 scripts/check_messages_architecture.py

      - name: Check Calls architecture
        run: python3 scripts/check_calls_architecture.py

      - name: Check Feed/posts architecture
        run: python3 scripts/check_feed_posts_architecture.py

      - name: Check People architecture
        run: python3 scripts/check_people_architecture.py

      - name: Check Stories architecture
        run: python3 scripts/check_stories_architecture.py

      - name: Check Pulse architecture
        run: python3 scripts/check_pulse_architecture.py

      - name: Check Reels architecture
        run: python3 scripts/check_reels_architecture.py

      - name: Check Sharing architecture
        run: python3 scripts/check_sharing_architecture.py

      - name: Check Notifications architecture
        run: python3 scripts/check_notifications_architecture.py

      - name: Check Privacy architecture
        run: python3 scripts/check_privacy_architecture.py

      - name: Check Settings architecture
        run: python3 scripts/check_settings_architecture.py

      - name: Check Security architecture
        run: python3 scripts/check_security_architecture.py

      - name: Check network architecture
        run: python3 scripts/check_network_architecture.py

      - name: Check shared UI architecture
        run: python3 scripts/check_shared_ui_architecture.py

      - name: Check whitespace errors
        run: git diff --check HEAD^1 HEAD

      - name: Create CI Firebase config
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "nova-ci",
              "storage_bucket": "nova-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.omarkhair70.nova"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyNovaCiOnlyDummyKey000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint Android release
        shell: bash
        run: |
          if ! ./gradlew --no-daemon lintRelease; then
            echo "--- Full release lint report ---"
            find app/build -name 'lint-results-release.txt' -print -exec cat {} \; || true
            exit 1
          fi

      - name: Assemble Android debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble Android instrumentation APK
        run: ./gradlew --no-daemon assembleDebugAndroidTest

      - name: Assemble Android release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Build Android release App Bundle
        run: ./gradlew --no-daemon bundleRelease
