name: Plantupia Public Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/plantupia-public-web.yml"
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/plantupia-public-web.yml"

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

      - name: Smoke-test scene route
        run: |
          set -euo pipefail
          npm run start -- -p 3017 >/tmp/plantupia-web-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:3017/study/scene -o /tmp/plantupia-scene.html; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/plantupia-web-start.log
            exit 1
          fi
          grep -q 'A Space' /tmp/plantupia-scene.html
          grep -q 'Hold to compare' /tmp/plantupia-scene.html
          grep -q 'The Space' /tmp/plantupia-scene.html
