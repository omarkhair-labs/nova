name: Plantupia Public Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/plantupia-public-web.yml"
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/plantupia-public-web.yml"

jobs:
  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify independent Inbox and image publication release gates
        run: node scripts/check-release-modes.mjs
      - name: Production build
        run: npm run build

      - name: Smoke-test public routes and safety gates
        run: |
          set -euo pipefail
          npm run start -- -p 3017 >/tmp/plantupia-web-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3017/ -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/plantupia-web-start.log
            exit 1
          fi
          node scripts/closure-smoke.mjs
      - name: Verify runner-provided Chrome
        run: google-chrome --version

      - name: Browser acceptance / phone and desktop
        run: |
          set -euo pipefail
          npm run start -- -p 3017 >/tmp/plantupia-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3017/ -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/plantupia-browser.log
            exit 1
          fi
          npm run test:browser
