name: Plantupia core roots

on:
  pull_request:
    paths:
      - 'app/**'
      - 'backend/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/plantupia-core-roots.yml'
      - '.github/scripts/plantupia-core-roots.sh'

permissions:
  contents: read

concurrency:
  group: plantupia-core-roots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-core-roots:
    name: Current roots against disposable local Django
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout the reviewed PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
        timeout-minutes: 3

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
        timeout-minutes: 5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
        timeout-minutes: 5

      - name: Install the existing backend dependencies
        run: python -m pip install -r backend/requirements.txt
        timeout-minutes: 8

      - name: Enable hosted runner KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=15
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            ls -l /dev/kvm || true
            id
            lscpu
            echo '::error::The hosted runner did not provide usable KVM after udev settled.'
            exit 1
          fi

      - name: Create the disposable QA Firebase placeholder
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p app/src/qa
          cat > app/src/qa/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "nova-ci",
              "storage_bucket": "nova-ci.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789000:android:0000000000000000000000",
                "android_client_info": { "package_name": "com.omarkhair70.nova.qa" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIzaSyNovaCiOnlyDummyKey000000000000000" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Assemble localhost-only QA app and instrumentation
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/core-roots/test-results
          git rev-parse HEAD > artifacts/core-roots/test-results/commit.txt
          chmod +x gradlew
          timeout --signal=TERM --kill-after=30s 20m ./gradlew --no-daemon --max-workers=2 --stacktrace \
            -PplantupiaQaInstrumentation=true \
            -PplantupiaQaApiUrl=http://127.0.0.1:8765/api/v1/ \
            :app:assembleQa :app:assembleQaAndroidTest \
            2>&1 | tee artifacts/core-roots/test-results/build.txt

      - name: Run current roots on a fresh emulator and private local fixture
        # Same pinned action as the separate entrance checks.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 45
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          avd-name: plantupia-core-roots
          emulator-port: 5554
          force-avd-creation: true
          emulator-boot-timeout: 480
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/plantupia-core-roots.sh

      - name: Retain host diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/core-roots/diagnostics
          df -h > artifacts/core-roots/diagnostics/host-disk.txt
          timeout --signal=TERM --kill-after=5s 30s adb devices -l > artifacts/core-roots/diagnostics/adb-after-action.txt 2>&1 || true

      - name: Upload actual root screenshots
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: core-roots-evidence
          path: artifacts/core-roots/craft-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload sanitized results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: core-roots-test-results
          path: |
            artifacts/core-roots/test-results/
            artifacts/core-roots/diagnostics/
          if-no-files-found: error
          retention-days: 7
