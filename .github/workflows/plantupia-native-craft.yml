name: Plantupia native craft

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/plantupia-native-craft.yml'
      - '.github/scripts/plantupia-native-craft.sh'

permissions:
  contents: read

concurrency:
  group: plantupia-native-craft-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entrance-and-restoration:
    name: Entrance, keyboard and draft restoration
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Checkout the reviewed PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
        timeout-minutes: 3

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
        timeout-minutes: 5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5

      - name: Enable hosted runner KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Create disposable CI Firebase config
        timeout-minutes: 1
        shell: bash
        run: |
          # Same non-production placeholder as Nova CI; generated only on this runner.
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789000",
              "project_id": "nova-ci",
              "storage_bucket": "nova-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.omarkhair70.nova"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyNovaCiOnlyDummyKey000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Assemble debug app and focused-test APK
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-craft/test-results
          git rev-parse HEAD > artifacts/native-craft/test-results/commit.txt
          chmod +x gradlew
          timeout --signal=TERM --kill-after=30s 20m ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee artifacts/native-craft/test-results/build.txt

      - name: Run isolated native craft checks and collect images
        # v2.38.0 / current v2, verified against the primary repository on 2026-11-25.
        # https://github.com/ReactiveCircus/android-emulator-runner/tree/a421e43855164a8197daf9d8d40fe71c6996bb0d
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        timeout-minutes: 30
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          avd-name: plantupia-craft
          emulator-port: 5554
          force-avd-creation: true
          emulator-boot-timeout: 480
          disable-linux-hw-accel: false
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The action executes input lines in separate shells. Keep the bounded
          # runner and its failure-time capture together in one Bash process.
          script: bash .github/scripts/plantupia-native-craft.sh

      - name: Retain host diagnostics even if emulator startup fails
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/native-craft/diagnostics
          df -h > artifacts/native-craft/diagnostics/host-disk.txt
          timeout --signal=TERM --kill-after=5s 30s adb devices -l > artifacts/native-craft/diagnostics/adb-after-action.txt 2>&1 || true

      - name: Upload actual native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: craft-evidence
          path: artifacts/native-craft/craft-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload runner results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: native-craft-test-results
          path: |
            artifacts/native-craft/test-results/
            artifacts/native-craft/diagnostics/
          if-no-files-found: error
          retention-days: 7
