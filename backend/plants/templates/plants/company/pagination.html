{% if records.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Result pages">{% if records.has_previous %}<a href="?page={{ records.previous_page_number }}&q={{ query|urlencode }}&status={{ state|urlencode }}">← Previous</a>{% endif %}<span>Page {{ records.number }} of {{ records.paginator.num_pages }}</span>{% if records.has_next %}<a href="?page={{ records.next_page_number }}&q={{ query|urlencode }}&status={{ state|urlencode }}">Next →</a>{% endif %}</nav>{% endif %}
