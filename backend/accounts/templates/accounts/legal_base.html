<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Nova{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7fb;
      --surface: #ffffff;
      --ink: #17151f;
      --muted: #696575;
      --border: #e7e4ef;
      --accent: #6657df;
      --accent-soft: #efedff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111015;
        --surface: #1b1921;
        --ink: #f4f1fa;
        --muted: #b5afc2;
        --border: #302c39;
        --accent: #aa9fff;
        --accent-soft: #292440;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    main {
      width: min(820px, calc(100% - 32px));
      margin: 48px auto 72px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 22px;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 900;
    }
    article {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: clamp(22px, 5vw, 44px);
      box-shadow: 0 14px 40px rgba(30, 24, 48, .06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }
    h2 {
      margin: 34px 0 10px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    p, li { color: var(--muted); }
    ul { padding-left: 22px; }
    a { color: var(--accent); }
    .updated {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
    }
    .callout {
      margin: 24px 0;
      padding: 16px 18px;
      border-radius: 16px;
      background: var(--accent-soft);
      color: var(--ink);
    }
    .button {
      display: inline-block;
      margin: 8px 0 4px;
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    footer {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/privacy/" aria-label="Nova legal home">
      <span class="mark">N</span>
      <span>Nova</span>
    </a>
    <article>
      {% block content %}{% endblock %}
    </article>
    <footer>Nova · Social connection with privacy controls</footer>
  </main>
</body>
</html>
